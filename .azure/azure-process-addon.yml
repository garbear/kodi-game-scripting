parameters:
  addons : []
  # Jenkins loads pipeline-library using GitHub's 60 requests/hour/IP quota.
  # A version bump triggers both master and tag builds. At 15 minutes/core,
  # 8 builds/hour leaves 20 requests of headroom if each build uses 5 requests.
  # This is an estimate; other Jenkins jobs share the same quota.
  # Long core lists need batching to fit Azure's hosted-agent job timeout.
  addonDelaySeconds: 900

steps:
  - ${{ each addon in parameters.addons }}:
    - ${{ if ne(addon, parameters.addons[0]) }}:
      - script: |
          echo "Waiting $ADDON_DELAY_SECONDS seconds before the next core for Jenkins master/tag builds"
          sleep "$ADDON_DELAY_SECONDS"
        displayName: 'Wait before ${{ addon }}'
        env:
          ADDON_DELAY_SECONDS: ${{ parameters.addonDelaySeconds }}
    - script: |
        ./process_game_addons.py --game-addons-dir="game-addons" --kodi-source-dir="$(pwd)/kodi" --git --compile --push-branch="master" --filter="${{ addon }}"
      displayName: 'Process ${{ addon }}'
      continueOnError: true
      env:
        GITHUB_ACCESS_TOKEN: $(GITHUB_ACCESS_TOKEN)
